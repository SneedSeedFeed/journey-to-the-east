 jtte.200.sadistic:0 "Make the silence awkward."
 jtte_purpose_sadistic_approach_tt:0 "If I must spend the day uncomfortable, I can at least endeavour to share the experience."
 jtte.purpose.sadistic.comfortable:0 "I strike up conversation, and carefully plan a series of prolonged silences and grimaces to make them second guess their words. By day's end they're wishing I'd just kill them instead."
 jtte.purpose.sadistic.strained:0 "[scope:jtte_test_vampire.GetFirstNameNoTooltip] appears entirely untroubled by the awkward tension. I must work harder."
 jtte.purpose.sadistic.barely:0 "[scope:jtte_test_vampire.GetFirstNameNoTooltip] seems so utterly oblivious to social cues that my efforts are meaningless, instead they just wish to speak about their favourite Japanese manuscripts. Kill me."

