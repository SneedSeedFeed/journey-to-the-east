 jtte.200.eccentric:0 "Explain my theory."
 jtte_purpose_eccentric_approach_tt:0 "Vampires are weak to the light of the Sun. If I simply capture its rays in a box of mirrors, I can store its light to be used later in some kind of "Sun gun". Or perhaps instead I could carry the light of dawn across the country with a series of mirrors, to be used against the supernatural before the Sun has even risen."
 jtte.purpose.eccentric.comfortable:0 "[scope:jtte_test_vampire.GetFirstNameNoTooltip] asks excellent questions about the construction of such devices. Finally, an audience."
 jtte.purpose.eccentric.strained:0 "[scope:jtte_test_vampire.GetFirstNameNoTooltip] struggles to follow along. I scrawl out some diagrams in charcoal but they don't think any of it could work."
 jtte.purpose.eccentric.barely:0 "[scope:jtte_test_vampire.GetFirstNameNoTooltip] proposes that if moonlight is just reflected sunlight, as proposed by Anaxagoras, that my mirrored contraptions would dilute the effects down to nothing."

 jtte.200.vengeful:0 "Remember who arranged this."
 jtte_purpose_vengeful_approach_tt:0 "[scope:jtte_test_vampire.GetFirstNameNoTooltip] merely accepted an invitation. The instructor is the one who owes me an afternoon."
 jtte.purpose.vengeful.comfortable:0 "Planning a suitably tedious wild-goose chase for my mentor keeps me occupied."
 jtte.purpose.vengeful.strained:0 "My proposed revenge becomes more elaborate with each passing hour. Surely someone in the area can produce such a mechanism..."
 jtte.purpose.vengeful.barely:0 "By sunset my plan requires three carpenters, a goat, an exact replica of the holy grail and a moderately sized troupe of dancers. I suspect I have lost perspective."

 jtte.200.forgiving:0 "Begin with a clean slate."
 jtte_purpose_forgiving_approach_tt:0 "I can set my suspicions aside for one day. Surely the vampire my mentor has selected is a reasonable sort, worthy of a second chance."
 jtte.purpose.forgiving.comfortable:0 "We just have a pleasant conversation, like any other two normal human acquiantances forced into a small room together for a prolonged period."
 jtte.purpose.forgiving.strained:0 "It turns out that responding to everything with "I understand" or "I forgive you" is annoying?"
 jtte.purpose.forgiving.barely:0 "I run through my pre-prepared list of vampiric sins to forgive them for, somehow that makes me a "patronising holier-than-thou bastard"?"

 jtte.200.fallback:0 "I have literally no personality."
 jtte_purpose_fallback_approach_tt:0 "How did I reach this point in life with no personality? What's wrong with me? What's wrong with YOU, the player reading this? Or did the developer make a mistake where this is reachable?"
 jtte.purpose.fallback.comfortable:0 "I talk about the weather and a cool sword I saw at the market until [scope:jtte_test_vampire.GetFirstNameNoTooltip] plugs their ears shut."
 jtte.purpose.fallback.strained:0 "For real if you're seeing this option in normal gameplay, let the dev know. You should only see this if you have no personality traits at all."
 jtte.purpose.fallback.barely:0 "My foe asks me to rotate an apple omni-directionally in my mind, I shatter into a million shards."
 jtte_purpose_no_stress_tt:0 "You complete the test."
