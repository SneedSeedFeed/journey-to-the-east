 jtte.purpose.paranoid.comfortable:0 "I have a series of solid escape plans should things go awry, and pass my time with confidence."
 jtte.purpose.paranoid.strained:0 "I have a good dozen escape plans now, perhaps one more wouldn't hurt."
 jtte.purpose.paranoid.barely:0 "I have prepared for every single possible move [scope:jtte_test_vampire.GetFirstNameNoTooltip] could make. [scope:jtte_test_vampire.GetFirstNameNoTooltip] spends the afternoon examining a loose thread on their sleeve."

