 jtte.purpose.shy.comfortable:0 "Without the burden of eye contact, the silence becomes quite companionable."
 jtte.purpose.shy.strained:0 "I worry that turning my back was rude, but turning around now would be worse."
 jtte.purpose.shy.barely:0 "Turning the chair was not enough. Perhaps behind the curtain is a better place for me."

