 jtte_train_body_decision_tooltip:0 "Train the Body"
 jtte_train_body_decision_confirm:0 "Proceed"
 jtte_train_mind_decision:0 "Discipline the Mind"
 jtte_train_mind_decision_desc:0 "The lessons demand an attentive mind. Scholarship, sound instruction, and the willingness to listen each have their place."
 jtte_train_mind_decision_tooltip:0 "Discipline the Mind"
 jtte_train_mind_decision_confirm:0 "Proceed"
 jtte_train_purpose_decision:0 "Undertake the Final Test"
 jtte_train_purpose_decision_desc:0 "My lessons of body and mind are complete. Only the final test remains. I have been told to expect a formidable opponent."
 jtte_train_purpose_decision_tooltip:0 "Undertake the final test of restraint"
 jtte_train_purpose_decision_confirm:0 "Proceed"
 jtte_recognition_decision:0 "Earn Recognition"
 jtte_recognition_decision_desc:0 "Demonstrate that your command of Qiao deserves recognition."
 jtte_recognition_decision_tooltip:0 "Earn Recognition"
 jtte_recognition_decision_confirm:0 "Proceed"
 jtte_qiao_discovery_decision:0 "Research the Mortal Limitations"
 jtte_qiao_discovery_decision_desc:0 "Study how Qiao might be adapted to an immortal existence."
 jtte_qiao_discovery_decision_tooltip:0 "Research the Mortal Limitations"
 jtte_qiao_discovery_decision_confirm:0 "Proceed"
 jtte_qiao_implementation_decision:0 "Adapt the Higher Qiao"
 jtte_qiao_implementation_decision_desc:0 "Put your research into practice, overcoming the limits of Qiao."
 jtte_qiao_implementation_decision_tooltip:0 "Adapt the Higher Qiao"
 jtte_qiao_implementation_decision_confirm:0 "Proceed"
 jtte_qiao_research_text_tt:0 "Own the Manual of Yi or the complete Bai Ze Tu."
 jtte.200.t:0 "The Ultimate Trial"
 jtte.200.desc:0 "My mentor gives the final test an introduction worthy of a battle against the forces of hell themselves. My body is steel itself, my mind a razor. Now my purpose will be revealed.\nI'm ushered into a quiet side room of our usual training grounds, as my mentor leaves to fetch my foe. It's a cosy space, minimally furnished with just a pair of simple chairs and a thick tarp covering the only window. Soon thereafter, a pair of footsteps approach, the door swings wide, my mentor arrives with my victim in tow: a vampire. At last, something familiar. My hand goes to my weapon.\n\n'No. Put that away you fool. This is [scope:jtte_test_vampire.GetFirstNameNoTooltip], you must share this room until the sun goes down without physically harming oneanother.'\nI stare incredulously at them as I await the rest of the instructions. There are none. [scope:jtte_test_vampire.GetFirstNameNoTooltip] slumps into their chair with a sigh.\n'Get along now you two.'"
 jtte.201.t:0 "A Day Without Incident"
 jtte.201.conclusion:0 "\n\nAt last, the door opens. The instructor surveys two intact participants, two chairs, and no fresh blood.\n\n'You could have used force. You chose not to. That was the test.'\n\nMy introductory training is complete. I may now begin studying Qiao."
 jtte.201.a:0 "I have earned the right to continue."
 jtte_purpose_access_tt:0 "Complete your training and gain access to the Qiao lifestyle."

 jtte.200.lustful:0 "Imagine them naked."
 jtte_purpose_lustful_approach_tt:0 "Surely those clothes conceal something far less alarming."
 jtte.purpose.lustful.comfortable:0 "The exercise proves remarkably effective. My incredible 'vigour' has far surpassed my vitriol."
 jtte.purpose.lustful.strained:0 "It succeeds. I spend the day boring holes in the floor with my gaze, cheeks flush."
 jtte.purpose.lustful.barely:0 "My imagination is far too successful, and I am now left with a completely different problem."

 jtte.200.chaste:0 "Imagine them dressed like a nun."
 jtte_purpose_chaste_approach_tt:0 "A veil, a severe collar, sensible shoes. With enough mental tailoring, anyone can look respectable."
 jtte.purpose.chaste.comfortable:0 "It's like a quiet Sunday at church, respectably dull."
 jtte.purpose.chaste.strained:0 "Thoughts of [scope:jtte_test_vampire.GetFirstNameNoTooltip] gently lifting the habit to expose a delicate ankle begin to creep in."
 jtte.purpose.chaste.barely:0 "Oh no, they're hot. My thoughts require constant, increasingly desperate correction."

 jtte.200.gluttonous:0 "Good think I brought snacks."
 jtte_purpose_gluttonous_approach_tt:0 "A campaign requires supplies, I shall provision this chair for a prolonged siege."
 jtte.purpose.gluttonous.comfortable:0 "A hearty meal, a comfortable nap, rinse and repeat."
 jtte.purpose.gluttonous.strained:0 "I finish the provisions before noon. The afternoon is much longer than the morning."
 jtte.purpose.gluttonous.barely:0 "I've engorged myself before midmorning, half of it comes back out and I'm left twiddling my thumbs next to a puddle of vomit."

 jtte.200.temperate:0 "A little stress is good for the soul."
 jtte_purpose_temperate_approach_tt:0 "I embrace the ordeal wholeheartedly, I must simply resist my righteous zeal in the face of the undead."
 jtte.purpose.temperate.comfortable:0 "My mind is a temple under siege, yet it remains serene among the flames. I'd ask my mentor for a second vampire if I could."
 jtte.purpose.temperate.strained:0 "If they look at my neck one more time I might snap."
 jtte.purpose.temperate.barely:0 "I spend the day sitting with my hands under my armpits like a child throwing a tantrum."

