 jtte.200.impatient:0 "One small victory at a time."
 jtte_purpose_impatient_approach_tt:0 "A whole day is absurd. A few minutes, repeated often enough, might be manageable."
 jtte.purpose.impatient.comfortable:0 "A succession of little milestones makes the waiting bearable."
 jtte.purpose.impatient.strained:0 "I celebrate noon too early. Twice."
 jtte.purpose.impatient.barely:0 "I congratulate myself on surviving the first hour, only to learn that scarcely a quarter of it has passed."

 jtte.200.arrogant:0 "They may admire me in silence."
 jtte_purpose_arrogant_approach_tt:0 "I am under no obligation to acknowledge every creature admitted to my presence."
 jtte.purpose.arrogant.comfortable:0 "I remain magnificently aloof. [scope:jtte_test_vampire.GetFirstNameNoTooltip] is blatantly in awe of my majesty."
 jtte.purpose.arrogant.strained:0 "I occasionally check whether my indifference has been noticed."
 jtte.purpose.arrogant.barely:0 "[scope:jtte_test_vampire.GetFirstNameNoTooltip] ignores me with infuriating ease, not that I wanted their attention or anything b-baka..."

